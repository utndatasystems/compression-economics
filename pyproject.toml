[project]
name = "compression-economics"
version = "0.1.0"
description = "LLM-guided text compression experiments with global token masks"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "accelerate>=1.12.0",
    "datasets>=4.5.0",
    "numpy>=2.0,<2.3",
    "peft>=0.18.1",
    "pyroaring>=1.0.3",
    "pytest>=9.0.2",
    "scalene>=2.1.4",
    "seaborn>=0.13.2",
    "transformers>=4.56.0,<5",
    "zstandard>=0.25.0",
]

[project.optional-dependencies]
transformer = [
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "torchvision==0.25.0",
]
vllm = [
    "flashinfer-cubin==0.6.4",
    "flashinfer-python==0.6.4",
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "torchvision==0.25.0",
    "vllm==0.17.1",
]
sglang = [
    "flashinfer-cubin==0.6.3",
    "flashinfer-python==0.6.3",
    "sglang==0.5.9",
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "transformers==4.57.1",
]

[dependency-groups]
dev = [
    "bitvector>=3.5.0",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "pandas>=3.0.1",
    "setuptools<=80.0.0",
    "tensorboard>=2.20.0",
    "torch-tb-profiler>=0.4.3",
]

[tool.uv]
conflicts = [
    [
        { extra = "sglang" },
        { extra = "transformer" },
    ],
    [
        { extra = "sglang" },
        { extra = "vllm" },
    ],
]
