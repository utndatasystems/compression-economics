[project]
name = "compression-economics"
version = "0.1.0"
description = "LLM-guided text compression experiments with global token masks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "zstandard>=0.25.0",
    "transformers>=5.3.0",
    "torch>=2.10.0",
    "pyroaring>=1.0.3",
    "accelerate>=1.13.0",
    "peft>=0.18.1",
    "datasets>=4.7.0",
    "pytest>=9.0.2",
    "bitsandbytes>=0.49.2",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "notebook>=7.5.5",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "wandb>=0.25.1",
    "vllm>=0.21.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "ipykernel>=7.2.0",
    "ipywidgets",
    "notebook",
    "pandas>=3.0.1",
    "tensorboard>=2.20.0",
    "torch-tb-profiler>=0.4.3",
    "scalene>=2.1.4",
    "bitvector>=3.5.0",
    "setuptools<=80.0.0",
    "bitsandbytes>=0.49.2",
]
