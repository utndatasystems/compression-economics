[project]
name = "compression-economics"
version = "0.1.0"
description = "LLM-guided text compression experiments with global token masks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.12.0",
    "datasets>=4.5.0",
    "numpy>=2.4.2",
    "peft>=0.18.1",
    "pyroaring>=1.0.3",
    "pytest>=9.0.2",
    "scalene>=2.1.4",
    "seaborn>=0.13.2",
    "sglang>=0.5.9",
    "torch>=2.10.0",
    "transformers>=5.2.0",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
    "bitvector>=3.5.0",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "pandas>=3.0.1",
    "setuptools<=80.0.0",
    "tensorboard>=2.20.0",
    "torch-tb-profiler>=0.4.3",
]
